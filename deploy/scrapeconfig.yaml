---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: station-monitor-node-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  metricsPath: /metrics
  scrapeInterval: 30s
  staticConfigs:
    - targets:
        - "192.168.1.90:9100"
      labels:
        job: station-node-exporter
        instance: g-console
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: station-monitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  metricsPath: /metrics
  scrapeInterval: 30s
  staticConfigs:
    - targets:
        - "192.168.1.90:9101"
      labels:
        job: station-monitor
        instance: g-console
